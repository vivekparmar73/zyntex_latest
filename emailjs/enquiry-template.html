<!-- EmailJS template: enquiry delivered to the Zyntex inbox.
     Settings in EmailJS → Email Templates:
       To Email:  {{to_email}}
       From Name: Zyntex Website
       Reply To:  {{reply_to}}
       Subject:   New enquiry: {{inquiry}} — {{from_name}} ({{company}})
     Paste everything below into the template's HTML (code) editor. -->
<div style="margin:0;padding:24px;background:#f5f6f4;font-family:Arial,Helvetica,sans-serif;color:#1e2327;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3e6e8;">
    <tr>
      <td style="background:#0f5c3a;padding:22px 28px;">
        <div style="color:#ffffff;font-size:20px;font-weight:800;letter-spacing:3px;">ZYNTEX</div>
        <div style="color:#bfe3cf;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:4px;">New website enquiry</div>
      </td>
    </tr>
    <tr>
      <td style="padding:26px 28px 8px;">
        <p style="margin:0 0 18px;font-size:15px;">A new message was sent from the Zyntex contact form.</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;border-collapse:collapse;">
          <tr><td style="padding:9px 0;color:#5b646b;width:130px;border-bottom:1px solid #eef0f1;">Name</td><td style="padding:9px 0;font-weight:bold;border-bottom:1px solid #eef0f1;">{{from_name}}</td></tr>
          <tr><td style="padding:9px 0;color:#5b646b;border-bottom:1px solid #eef0f1;">Company</td><td style="padding:9px 0;border-bottom:1px solid #eef0f1;">{{company}}</td></tr>
          <tr><td style="padding:9px 0;color:#5b646b;border-bottom:1px solid #eef0f1;">Email</td><td style="padding:9px 0;border-bottom:1px solid #eef0f1;"><a href="mailto:{{from_email}}" style="color:#137047;">{{from_email}}</a></td></tr>
          <tr><td style="padding:9px 0;color:#5b646b;border-bottom:1px solid #eef0f1;">Phone</td><td style="padding:9px 0;border-bottom:1px solid #eef0f1;">{{phone}}</td></tr>
          <tr><td style="padding:9px 0;color:#5b646b;border-bottom:1px solid #eef0f1;">Inquiry type</td><td style="padding:9px 0;border-bottom:1px solid #eef0f1;"><span style="background:#eef7f2;color:#0f5c3a;padding:3px 10px;border-radius:999px;font-size:13px;">{{inquiry}}</span></td></tr>
        </table>
        <div style="margin:22px 0 6px;color:#5b646b;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;">Message</div>
        <div style="background:#f5f6f4;border-left:3px solid #1a8656;padding:14px 16px;font-size:14px;line-height:1.6;white-space:pre-wrap;">{{message}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:18px 28px 26px;">
        <a href="mailto:{{from_email}}" style="display:inline-block;background:#0f5c3a;color:#ffffff;text-decoration:none;padding:11px 22px;border-radius:999px;font-size:13px;font-weight:bold;letter-spacing:1px;">REPLY TO {{from_name}}</a>
        <p style="margin:18px 0 0;font-size:12px;color:#8a9298;">Sent {{submitted_at}} from {{page_url}}</p>
      </td>
    </tr>
  </table>
</div>
